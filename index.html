<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile Card</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=League+Spartan:wght@100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <main>
            <div class="card-container">
                <div class="background-image">
                    <img src="../images/bg-pattern-card.svg" class="background" alt="background image" width="100%">
                    <img src="../images/image-victor.jpg" class="profile-image" alt="image of user">
                </div>
                <div class="identity">
                    <div class="profile">
                        <p class="full-name">Victor Crest</p>
                        <p class="age"> 26</p>
                    </div>
                    <div class="location">
                        <p class="city">London</p>
                    </div>
                </div>
                <hr>
                <div class="statistics">
                    <div class="follower-number">
                        <p class="stats">80K</p>
                        <p class="followers">Followers</p>
                    </div>
                    <div class="likes-stats">
                        <p class="stats">803K</p>
                        <p class="likes">Likes</p>
                    </div>
                    <div class="photos-stats">
                        <p class="stats">1.4K</p>
                        <p class="photos">Photos</p>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
